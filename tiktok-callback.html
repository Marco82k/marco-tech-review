<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Connecting – Marco Tech Studio</title>
<style>
  :root { --bg: #E4E5E0; --ink: #17181C; --pencil: #55585E; --screen: #3B36E6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1122; --ink: #E6E7EF; --pencil: #9EA2B8; --screen: #8C88FF; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 80px 16px; }
  a { color: var(--screen); }
  p { color: var(--pencil); }
</style>
</head>
<body>
<main>
<h1>Connecting your account…</h1>
<p id="msg">Returning to Marco Tech Studio on this computer.</p>
<p><a id="link" href="http://localhost:8790/">Continue</a></p>
</main>
<script>
  // L'accesso (TikTok, poi YouTube e Instagram) torna qui: rimando codice e state a Studio Recensioni sul Mac.
  // Il codice resta solo nel browser: questa pagina non lo invia da nessun'altra parte.
  var q = location.search || "";
  var dest = "http://localhost:8790/" + (q ? q + "&" : "?") + "piattaforma=tiktok";
  document.getElementById("link").href = dest;
  if (q.indexOf("code=") !== -1 || q.indexOf("error=") !== -1) {
    location.replace(dest);
  } else {
    document.getElementById("msg").textContent = "No login code in this link. Open the connection again from the app.";
  }
</script>
</body>
</html>
